name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar ferramentas de build
        run: python -m pip install -r requirements-build.txt

      - name: Validar sintaxe
        run: python -m compileall -q .

      - name: Executar testes
        run: python -m unittest discover -s tests -v

      - name: Compilar executável
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --uac-admin
          --name PrintRescue_Windows
          --collect-submodules printrescue
          main.py

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: PrintRescue-Windows
          path: dist/PrintRescue_Windows.exe
          if-no-files-found: error
