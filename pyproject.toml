[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "printrescue-windows"
version = "1.0.0"
description = "Diagnóstico e reparo de impressoras compartilhadas no Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "PrintRescue contributors" }
]
keywords = ["windows", "printer", "printing", "smb", "rpc", "lpr", "troubleshooting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration"
]

[project.gui-scripts]
printrescue = "printrescue.app:main"

[tool.setuptools.packages.find]
include = ["printrescue*"]
